<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Graveyard</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="hero">
      <img class="brand-icon" src="assets/tombstone.svg" alt="Tombstone icon" />
      <h1 id="title">Crypto Graveyard</h1>
      <p class="hero-copy">
        Major shutdowns, bankruptcies, and forced wind-downs across crypto.
      </p>
    </header>

    <main class="container">
      <div class="toolbar" aria-label="Timeline controls">
        <label class="search-field" for="searchInput">
          <span class="sr-only">Search events</span>
          <input
            id="searchInput"
            type="search"
            placeholder="Search"
            autocomplete="off"
          />
        </label>
        <label class="filter-field" for="categoryFilter">
          <span class="sr-only">Filter by category</span>
          <select id="categoryFilter" aria-label="Filter by category"></select>
        </label>
      </div>

      <section
        class="timeline"
        id="timeline"
        aria-label="Crypto collapse timeline"
      ></section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
